{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}{% trans "Change Password" %} | Dashboard RAB{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">

        <div class="card dp-card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5 text-center">

                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle"
                        style="width: 80px; height: 80px;">
                        <i class="bi bi-check-circle-fill fs-1"></i>
                    </div>
                </div>

                <h4 class="fw-bold mb-3 text-body">{% trans "Password Changed" %}</h4>

                <p class="text-secondary mb-4">
                    {% trans "Your password is now changed." %}
                </p>

                <div class="d-grid gap-2">
                    <a href="{% url 'account_login' %}" class="btn btn-primary fw-bold shadow-sm">
                        {% trans "Log In Now" %}
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>
{% endblock %}
