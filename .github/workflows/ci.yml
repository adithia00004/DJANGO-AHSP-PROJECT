name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

env:
  # Use the dedicated test settings (matches pytest.ini). The previous value
  # config.settings overrode pytest.ini and ran the suite with non-test settings
  # (SESSION_COOKIE_SECURE=True + AllAuth backend) which breaks force_login over
  # the HTTP test client -> spurious /accounts/login redirects (302) in CI.
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_DB_ENGINE: postgres
  POSTGRES_DB: ahsp_ci
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5432

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ahsp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ahsp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest
