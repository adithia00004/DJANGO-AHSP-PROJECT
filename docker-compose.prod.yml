services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ahsp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ahsp_sni_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script still needs to be mounted or copied. 
      # Better to copy it in a custom DB image or just keep this mount if it's config-only.
      # For strict production, we usually bake it into image or use managed DB.
      # Keeping it mounted is fine for single-server VPS setup.
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # Hardened default (launch-audit F1): bind loopback only, so the DB is
      # never reachable from the network. Access remotely via SSH tunnel.
      # Override DB_BIND=0.0.0.0 explicitly only if you understand the risk.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ahsp_sni_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ahsp_network
    restart: always

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ahsp_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ahsp_network
    restart: always

  # PgBouncer - Connection Pool
  pgbouncer:
    image: pgbouncer:latest
    container_name: ahsp_pgbouncer
    environment:
      DATABASES_HOST: db
      DATABASES_PORT: 5432
      DATABASES_USER: ${POSTGRES_USER:-postgres}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASES_DBNAME: ${POSTGRES_DB:-ahsp_sni_db}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ahsp_network
    restart: always
    profiles:
      - pgbouncer

  # Django Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahsp_web
    environment:
      # Django Configuration
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS},healthcheck.local
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}

      # Database Configuration
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: ${POSTGRES_DB:-ahsp_sni_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${DB_PORT:-5432}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}

      # Application Configuration
      APP_VERSION: ${APP_VERSION:-1.0.0-docker}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}

      # Explicit Connection Strings (Critical for Docker)
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:${REDIS_PORT:-6379}/0
      CACHE_BACKEND: redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:${REDIS_PORT:-6379}/1

    volumes:
      # CRITICAL CHANGE: No code mount (- ./:/app)
      # Only mount persistent data directories
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs

    ports:
      # Hardened default (launch-audit F1): loopback only. The Caddy TLS proxy
      # (deploy/docker-compose.prod.proxy.yml) reaches `web` over the internal
      # docker network, so host publishing is only for local smoke tests.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - ahsp_network

    restart: always
    # Use Production Command (Gunicorn)
    # CMD is already defined in Dockerfile, but repeating here for clarity if needed.
    # We rely on Dockerfile CMD.

    # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahsp_celery
    command: celery -A config worker -l info --concurrency=4
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB:-ahsp_sni_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${DB_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:${REDIS_PORT:-6379}/0

    # No code mount

    depends_on:
      - db
      - redis
      - web
    networks:
      - ahsp_network
    restart: always
    profiles:
      - celery

  # Celery Beat
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahsp_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB:-ahsp_sni_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${DB_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:${REDIS_PORT:-6379}/0

    # No code mount

    depends_on:
      - db
      - redis
      - web
    networks:
      - ahsp_network
    restart: always
    profiles:
      - celery

  # Flower - Celery Monitoring (Optional in Prod)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahsp_flower
    # Hardened (launch-audit F1): Flower requires basic auth and binds loopback
    # only. Set FLOWER_BASIC_AUTH=user:strongpassword in the env file.
    command: celery -A config flower --port=5555 --basic-auth=${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH (user:password) is required} --broker=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:${REDIS_PORT:-6379}/0
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${FLOWER_BIND:-127.0.0.1}:${FLOWER_PORT:-5555}:5555"
    depends_on:
      - celery
    networks:
      - ahsp_network
    restart: always
    profiles:
      - celery

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:


networks:
  ahsp_network:
    driver: bridge

